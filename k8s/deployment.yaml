apiVersion: apps/v1
kind: Deployment
metadata: {name: taxi-bi-api}
spec:
 replicas: 2
 selector: {matchLabels: {app: taxi-bi-api}}
 template:
  metadata: {labels: {app: taxi-bi-api}}
  spec:
   containers:
   - name: api
     image: taxi-bi-api:latest
     ports: [{containerPort: 8090}]
---
apiVersion: v1
kind: Service
metadata: {name: taxi-bi-api}
spec:
 selector: {app: taxi-bi-api}
 ports: [{port: 8090,targetPort: 8090}]
